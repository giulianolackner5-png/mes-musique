<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Importateur MP3 Alexa</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .container { background: #1e1e1e; padding: 30px; display: inline-block; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 380px; }
        h1 { color: #00bbff; font-size: 24px; }
        input[type="file"] { display: none; }
        .upload-label { background: #252525; border: 2px dashed #00bbff; padding: 25px; display: block; margin: 20px 0; cursor: pointer; border-radius: 10px; transition: 0.3s; }
        .upload-label:hover { background: #2a2a2a; }
        button { background: #00bbff; color: #fff; border: none; padding: 12px 25px; cursor: pointer; font-weight: bold; width: 100%; border-radius: 25px; font-size: 16px; transition: 0.3s; }
        button:hover { background: #0088cc; }
        
        /* Style de la barre de chargement */
        .progress-container { width: 100%; background-color: #333; border-radius: 10px; margin: 20px 0; display: none; }
        .progress-bar { width: 0%; height: 10px; background-color: #00bbff; border-radius: 10px; transition: width 0.1s; }
        
        #status { margin-top: 15px; color: #bbb; font-weight: bold; word-break: break-all; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Importer pour Alexa</h1>
    <p>Sélectionne un fichier MP3 sur ton appareil pour l'activer sur ta Skill.</p>
    
    <label class="upload-label" for="file-input">
        <span id="file-text">📁 Cliquez pour choisir un MP3</span>
        <input type="file" id="file-input" accept="audio/mp3">
    </label>

    <button id="submit-btn">Lancer l'importation</button>
    
    <!-- Barre de progression visible pendant l'envoi -->
    <div class="progress-container" id="progress-area">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    
    <div id="status">En attente d'un fichier...</div>
</div>

<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, doc, setDoc } from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyAUgs-X0v-j1TdicX45schRwVfz--piPgg",
      authDomain: "://firebaseapp.com",
      projectId: "mon-lecteur-alexa",
      storageBucket: "mon-lecteur-alexa.firebasestorage.app",
      messagingSenderId: "765878158887",
      appId: "1:765878158887:web:94c3048157a70f05193002"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const fileInput = document.getElementById('file-input');
    const fileText = document.getElementById('file-text');
    const submitBtn = document.getElementById('submit-btn');
    const statusDiv = document.getElementById('status');
    const progressArea = document.getElementById('progress-area');
    const progressBar = document.getElementById('progress-bar');

    fileInput.addEventListener('change', (e) => {
        if(e.target.files.length > 0) {
            fileText.innerText = "🎵 " + e.target.files[0].name;
            statusDiv.innerHTML = "Fichier sélectionné avec succès !<br>Clique sur le bouton pour l'envoyer.";
        }
    });

    submitBtn.addEventListener('click', () => {
        if (fileInput.files.length === 0) {
            statusDiv.innerText = "❌ Choisis d'abord un fichier MP3 !";
            return;
        }

        const singleFile = fileInput.files[0];
        statusDiv.innerText = "⏳ Préparation du fichier...";
        progressArea.style.display = "block";
        progressBar.style.width = "0%";

        const formData = new FormData();
        formData.append('file', singleFile);

        // Création de la requête réseau avec suivi de progression
        const xhr = new XMLHttpRequest();
        
        // Cette fonction s'exécute à chaque fois que le fichier progresse sur internet
        xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable) {
                const percentComplete = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percentComplete + '%';
                statusDiv.innerHTML = "⏳ Envoi du MP3 en cours... <b>" + percentComplete + "%</b>";
            }
        });

        // Cette fonction s'exécute quand le serveur distant a bien reçu tout le fichier
        xhr.addEventListener('load', async () => {
            if (xhr.status === 200) {
                try {
                    const data = JSON.parse(xhr.responseText);
                    if (data.success || data.link) {
                        const musicUrl = data.link;
                        statusDiv.innerHTML = "⚙️ Fichier reçu par le serveur !<br>Liaison en cours avec ta base Firebase Alexa...";

                        // Enregistrement des détails dans Cloud Firestore
                        await setDoc(doc(db, "musiques", "current_song"), {
                            url: musicUrl,
                            song_name: singleFile.name,
                            timestamp: new Date()
                        });

                        statusDiv.innerHTML = "<span style='color: #00ff88;'>✅ IMPORTATION RÉUSSIE !</span><br><br><b>Nom :</b> " + singleFile.name + "<br><b>Lien généré :</b> " + musicUrl + "<br><br>Tu peux maintenant le demander à Alexa !";
                    } else {
                        statusDiv.innerText = "❌ Le serveur d'hébergement a refusé le fichier.";
                    }
                } catch (err) {
                    statusDiv.innerText = "❌ Erreur lors du traitement de la réponse du serveur.";
                }
            } else {
                statusDiv.innerText = "❌ Erreur de transfert avec le serveur (Code: " + xhr.status + ").";
            }
        });

        xhr.addEventListener('error', () => {
            statusDiv.innerText = "❌ Erreur réseau lors de l'importation.";
        });

        // Envoi réel vers le serveur d'hébergement temporaire
        xhr.open('POST', 'https://file.io', true);
        xhr.send(formData);
    });
</script>
</body>
</html>
