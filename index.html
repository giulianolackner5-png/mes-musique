<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Importateur MP3 Alexa</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .container { background: #1e1e1e; padding: 30px; display: inline-block; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 380px; }
        h1 { color: #00bbff; font-size: 24px; }
        input[type="file"] { display: none; }
        .upload-label { background: #252525; border: 2px dashed #00bbff; padding: 25px; display: block; margin: 20px 0; cursor: pointer; border-radius: 10px; transition: 0.3s; }
        .upload-label:hover { background: #2a2a2a; }
        button { background: #00bbff; color: #fff; border: none; padding: 12px 25px; cursor: pointer; font-weight: bold; width: 100%; border-radius: 25px; font-size: 16px; transition: 0.3s; }
        button:hover { background: #0088cc; }
        #status { margin-top: 15px; color: #bbb; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Importer pour Alexa</h1>
    <p>Sélectionne un fichier MP3 sur ton appareil pour l'envoyer sur le site et l'activer sur ta Skill.</p>
    
    <label class="upload-label" for="file-input">
        <span id="file-text">📁 Cliquez pour choisir un MP3</span>
        <input type="file" id="file-input" accept="audio/mp3">
    </label>

    <button id="submit-btn">Lancer l'importation</button>
    <div id="status">En attente d'un fichier...</div>
</div>

<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, doc, setDoc } from "https://gstatic.com";

    // Configuration de ton Firebase pour parler à Alexa
    const firebaseConfig = {
      apiKey: "AIzaSyAUgs-X0v-j1TdicX45schRwVfz--piPgg",
      authDomain: "://firebaseapp.com",
      projectId: "mon-lecteur-alexa",
      storageBucket: "mon-lecteur-alexa.firebasestorage.app",
      messagingSenderId: "765878158887",
      appId: "1:765878158887:web:94c3048157a70f05193002"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const fileInput = document.getElementById('file-input');
    const fileText = document.getElementById('file-text');
    const submitBtn = document.getElementById('submit-btn');
    const statusDiv = document.getElementById('status');

    // Affiche le nom du fichier dès qu'on le choisit
    fileInput.addEventListener('change', (e) => {
        if(e.target.files.length > 0) {
            fileText.innerText = "🎵 " + e.target.files[0].name;
            statusDiv.innerText = "Fichier prêt à être envoyé.";
        }
    });

    // Action quand on clique sur le bouton
    submitBtn.addEventListener('click', async () => {
        if (fileInput.files.length === 0) {
            statusDiv.innerText = "❌ Choisis d'abord un fichier MP3 !";
            return;
        }

        const file = fileInput.files[0];
        statusDiv.innerText = "⏳ Envoi du MP3 en cours (ça peut prendre quelques secondes)...";

        // On utilise un serveur d'envoi de fichier gratuit et anonyme (File.io)
        const formData = new FormData();
        formData.append('file', file);

        try {
            // 1. Le site envoie le fichier sur le serveur internet
            const response = await fetch('https://file.io', { 
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();

            if (data.success) {
                statusDiv.innerText = "⏳ MP3 hébergé ! Liaison avec Alexa...";
                const musicUrl = data.link; // C'est l'URL HTTPS générée automatiquement

                // 2. Le site envoie cette URL directement dans ton Firebase Firestore pour Alexa
                await setDoc(doc(db, "musiques", "current_song"), {
                    url: musicUrl,
                    timestamp: new Date()
                });

                statusDiv.innerText = "✅ Réussi ! Ta musique est disponible sur Alexa !";
            } else {
                statusDiv.innerText = "❌ Erreur du serveur d'hébergement. Réessaye.";
            }
        } catch (err) {
            console.error(err);
            statusDiv.innerText = "❌ Erreur d'importation réseau.";
        }
    });
</script>
</body>
</html>
