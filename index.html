<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Lecteur Alexa - Importateur de Musique</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
        }
        h1 { color: #00bbff; font-size: 24px; margin-bottom: 20px; }
        .upload-box {
            border: 2px dashed #00bbff;
            padding: 30px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .upload-box:hover { background-color: #252525; }
        input[type="file"] { display: none; }
        button {
            background-color: #00bbff;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }
        button:hover { background-color: #0088cc; }
        #status { margin-top: 15px; font-weight: bold; color: #bbbbbb; }
        #link-container {
            margin-top: 20px;
            background-color: #292929;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Importateur Alexa</h1>
    <p>Sélectionnez votre musique au format MP3 pour l'envoyer sur le cloud.</p>
    
    <label class="upload-box" for="music-file">
        <span id="box-text">Cliquez pour choisir un MP3</span>
        <input type="file" id="music-file" accept="audio/mp3">
    </label>

    <button id="upload-btn">Uploader la musique</button>
    <div id="status">En attente d'un fichier...</div>
    
    <div id="link-container">
        <p style="font-size: 12px; margin: 0; color: #00bbff;">Lien direct généré pour votre Skill Alexa :</p>
        <span id="music-url" style="font-size: 14px; font-weight: bold;"></span>
    </div>
</div>

<!-- Scripts Firebase (Modules CDN) -->
<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://gstatic.com";

    // Configuration Firebase avec VOS clés privées injectées
    const firebaseConfig = {
      apiKey: "AIzaSyAUgs-X0v-j1TdicX45schRwVfz--piPgg",
      authDomain: "mon-lecteur-alexa.firebaseapp.com",
      projectId: "mon-lecteur-alexa",
      storageBucket: "mon-lecteur-alexa.firebasestorage.app",
      messagingSenderId: "765878158887",
      appId: "1:765878158887:web:94c3048157a70f05193002",
      measurementId: "G-7P80LY6HC3"
    };

    // Initialisation
    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    const fileInput = document.getElementById('music-file');
    const boxText = document.getElementById('box-text');
    const uploadBtn = document.getElementById('upload-btn');
    const statusDiv = document.getElementById('status');
    const linkContainer = document.getElementById('link-container');
    const musicUrlSpan = document.getElementById('music-url');

    // Détecte le choix de la musique
    fileInput.addEventListener('change', (e) => {
        if(e.target.files.length > 0) {
            boxText.innerText = "Fichier sélectionné : " + e.target.files[0].name;
            statusDiv.innerText = "Prêt pour l'envoi.";
        }
    });

    // Logique d'upload au clic sur le bouton
    uploadBtn.addEventListener('click', () => {
        const file = fileInput.files[0];
        if (!file) {
            statusDiv.innerText = "❌ Veuillez d'abord choisir un fichier !";
            return;
        }

        statusDiv.innerText = "⏳ Envoi en cours... Veuillez patienter.";
        
        // Crée un dossier "musiques" dans Firebase avec le nom de votre fichier
        const storageRef = ref(storage, 'musiques/' + file.name);

        uploadBytes(storageRef, file).then((snapshot) => {
            statusDiv.innerText = "✅ Musique enregistrée avec succès !";
            
            // Récupère le lien HTTPS sécurisé utilisable par Alexa
            return getDownloadURL(storageRef);
        }).then((url) => {
            linkContainer.style.display = "block";
            musicUrlSpan.innerText = url;
            console.log("URL utilisable par Alexa : ", url);
        }).catch((error) => {
            console.error(error);
            statusDiv.innerText = "❌ Erreur de stockage. Vérifiez vos règles Firebase Storage.";
        });
    });
</script>

</body>
</html>
