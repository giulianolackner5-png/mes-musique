<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Lecteur Alexa - Importateur de Musique</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
        }
        h1 { color: #00bbff; font-size: 24px; margin-bottom: 20px; }
        .upload-box {
            border: 2px dashed #00bbff;
            padding: 30px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            display: block;
            transition: 0.3s;
        }
        .upload-box:hover { background-color: #252525; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #252525;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #00bbff;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }
        button:hover { background-color: #0088cc; }
        #status { margin-top: 15px; font-weight: bold; color: #bbbbbb; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Importateur Alexa</h1>
    <p>Colle le lien direct de ton MP3 (ex: ton lien GitHub Pages) pour l'ajouter à ta Skill Alexa :</p>
    
    <input type="text" id="music-url-input" placeholder="https://.../ma-musique.mp3">

    <button id="upload-btn">Ajouter à Alexa</button>
    <div id="status">En attente d'un lien...</div>
</div>

<!-- Scripts Firebase (Modules CDN) -->
<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, doc, setDoc } from "https://gstatic.com";

    // Configuration Firebase avec tes clés
    const firebaseConfig = {
      apiKey: "AIzaSyAUgs-X0v-j1TdicX45schRwVfz--piPgg",
      authDomain: "://firebaseapp.com",
      projectId: "mon-lecteur-alexa",
      storageBucket: "mon-lecteur-alexa.firebasestorage.app",
      messagingSenderId: "765878158887",
      appId: "1:765878158887:web:94c3048157a70f05193002",
      measurementId: "G-7P80LY6HC3"
    };

    // Initialisation de Firebase et de Firestore (Base de données)
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlInput = document.getElementById('music-url-input');
    const uploadBtn = document.getElementById('upload-btn');
    const statusDiv = document.getElementById('status');

    uploadBtn.addEventListener('click', async () => {
        const urlFile = urlInput.value.trim();
        if (!urlFile) {
            statusDiv.innerText = "❌ Veuillez entrer une URL de fichier !";
            return;
        }

        statusDiv.innerText = "⏳ Enregistrement dans la base...";
        
        try {
            // Enregistre l'URL dans un document unique nommé "current_song" dans Firestore
            await setDoc(doc(db, "musiques", "current_song"), {
                url: urlFile,
                timestamp: new Date()
            });
            statusDiv.innerText = "✅ Lié à Alexa avec succès !";
            urlInput.value = "";
        } catch (error) {
            console.error(error);
            statusDiv.innerText = "❌ Erreur lors de l'enregistrement dans la base.";
        }
    });
</script>

</body>
</html>
